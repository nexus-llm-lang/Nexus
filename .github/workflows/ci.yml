name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-and-seed-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: bootstrap verification (stage0 -> stage1 -> stage2) + committed seed match
        run: ./bootstrap.sh --ci
      - name: Verify --install flag
        run: |
          TMPPREFIX=$(mktemp -d)
          ./bootstrap.sh --install "$TMPPREFIX"
          test -x "$TMPPREFIX/bin/nexus"
          "$TMPPREFIX/bin/nexus" --help | grep -q 'build'

  # Install nexus with `bootstrap.sh --install` inside a plain Alpine container
  # (wasmtime and wasm-tools from apk, no Nix), then run the built program.
  docker-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install and run in Alpine
        run: |
          docker run --rm -v "$PWD:/src:ro" alpine:edge sh -euc '
            apk add -q wasmtime wasm-tools bash coreutils gawk findutils tar git
            git config --global --add safe.directory "*"
            cp -r /src /work
            cd /work && ./bootstrap.sh --install /usr/local
            cd examples
            nexus build hello.nx -o hello.wasm
            test "$(wasmtime run -W tail-call=y,exceptions=y,function-references=y,stack-switching=y,threads=y hello.wasm)" = "👽️ こんにちは, world!"
          '

  test:
    runs-on: ubuntu-latest
    needs: bootstrap-and-seed-verify
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run tests via `nexus test`
        run: ./nexus test tests/ --junit junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml

  lint:
    runs-on: ubuntu-latest
    needs: bootstrap-and-seed-verify
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run linter over src/ and nxlib/
        run: ./nexus lint --check src/ nxlib/
      - name: Check the generated CLI reference is up to date
        run: ./nexus skill --check

  fmt-check:
    runs-on: ubuntu-latest
    needs: bootstrap-and-seed-verify
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Check formatting of all .nx sources (excluding known-bad fixtures)
        run: ./nexus fmt .

  examples-smoke:
    runs-on: ubuntu-latest
    needs: bootstrap-and-seed-verify
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Check examples/index.json lists every example
        run: |
          fail=0
          for f in examples/*.nx examples/feature/*.nx; do
            case "$(basename "$f")" in bench_*) continue ;; esac
            if ! grep -qF "\"path\": \"$f\"" examples/index.json; then
              echo "not indexed: $f" >&2
              fail=1
            fi
          done
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              echo "indexed but missing: $f" >&2
              fail=1
            fi
          done < <(grep -o '"path": "[^"]*"' examples/index.json | cut -d'"' -f4)
          exit "$fail"
      - name: Compile every positive example and skill template
        run: |
          # nexus build cannot write to /dev/null (wasm sandbox); use a temp file.
          # mktemp (no explicit /tmp) lands in $TMPDIR, which the launcher
          # preopens into the wasmtime sandbox.
          tmpout=$(mktemp --suffix=.wasm)
          trap 'rm -f "$tmpout"' EXIT
          fail=0
          for f in examples/*.nx examples/feature/*.nx skills/nexus-lang/templates/*.nx; do
            case "$f" in
              # math.nx is a library module (no main); not an executable
              # smoke target.
              examples/math.nx)
                echo "SKIP (library-no-main) $f"
                continue
                ;;
            esac
            # Net is provided only by a component build.
            target=""
            if grep -q '"std:network"' "$f"; then target="--p2-component"; fi
            if ./nexus build "$f" ${target:+"$target"} -o "$tmpout" 2>&1; then
              echo "OK $f"
            else
              echo "FAIL $f"
              fail=$((fail + 1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "examples-smoke: $fail failure(s)" >&2
            exit 1
          fi
